<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神经网络实验室</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel2:#0f172a; --line:#26334d;
  --text:#dbe7f3; --muted:#8aa0b8; --accent:#38bdf8; --red:#ff4d4f; --blue:#4d7cff;
  --green:#34d399; --orange:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;overflow-x:hidden}
header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,#0e1626,#0b1220)}
header h1{font-size:20px;font-weight:700;letter-spacing:1px}
header h1 span{color:var(--accent)}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.control{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.control label{color:var(--muted);white-space:nowrap}
.control select,.control input[type=number],.control button{background:#0a1424;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;outline:none}
.control select:focus,.control input:focus{border-color:var(--accent)}
.control input[type=range]{width:90px;accent-color:var(--accent)}
.control .val{display:inline-block;min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.btn{border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-blue{background:#0c4a6e;color:#bae6fd}
.btn-green{background:#065f46;color:#a7f3d0}
.btn-orange{background:#7c2d12;color:#fed7aa}
.btn-red{background:#7f1d1d;color:#fecaca}
.btn-gray{background:#1e293b;color:#cbd5e1;border:1px solid #334155}
.btn.active{outline:2px solid var(--accent)}
#main{display:grid;grid-template-columns:1fr 360px;gap:14px;padding:14px 18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card h3{margin-bottom:8px;font-size:15px;color:#e2ecf7;display:flex;align-items:center;justify-content:space-between}
canvas{display:block;width:100%}
#topologyCanvas{height:460px;cursor:crosshair}
#formulaPanel{position:sticky;top:12px;max-height:calc(100vh - 30px);overflow-y:auto}
#formulaPanel .formula{padding:7px 9px;border-left:3px solid #26334d;margin-bottom:5px;font-size:12.5px;color:var(--muted);border-radius:0 6px 6px 0;background:#0d1728;transition:.2s;font-family:Cambria Math,Georgia,serif}
#formulaPanel .formula.active{border-left-color:var(--accent);color:#fff;background:#0c2340;box-shadow:0 0 8px rgba(56,189,248,.25)}
#formulaPanel .formula b{color:#7dd3fc}
#formulaPanel .step-title{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#64748b;margin:8px 0 4px}
#bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:0 18px 18px;align-items:start}
#chartCanvas{height:280px}
#terrainCanvas{height:260px}
#drawCanvas{height:280px;width:280px;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#000;touch-action:none;cursor:crosshair}
.draw-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.draw-tools{display:flex;flex-direction:column;gap:8px;align-items:stretch;flex:1;min-width:130px}
.draw-tools .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mini-bars{width:100%;height:10px;margin-top:6px}
.mini-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .08s}
#drillPanel{display:none;margin-top:10px;padding:10px;background:#0d1728;border:1px solid var(--line);border-radius:10px;gap:12px;align-items:flex-start}
#drillPanel.show{display:flex;flex-wrap:wrap}
#drillCanvas{width:280px;height:280px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px}
.terrain-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:12px}
.terrain-controls select,.terrain-controls input{background:#0a1424;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-size:12px;width:auto}
.terrain-controls input[type=range]{width:70px}
.legend{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.muted{color:var(--muted);font-size:12px}

.step-control{position:relative}
.formula-tip{display:none;position:absolute;top:calc(100% + 10px);left:0;width:360px;background:#0d1728;border:1px solid var(--accent);border-radius:10px;padding:10px;z-index:1000;box-shadow:0 12px 30px rgba(0,0,0,.5);font-family:Cambria Math,Georgia,serif;font-size:12.5px}
.formula-tip.show{display:block}
.formula-tip .formula{padding:5px 7px;border-left:3px solid #26334d;margin-bottom:4px;color:var(--text);background:#0a1424;border-radius:0 6px 6px 0}
.formula-tip .formula:last-child{margin-bottom:0}
</style>
</head>
<body>
<header>
  <h1>神经网络<span>实验室</span></h1>
  <div class="controls">
    <div class="control"><label>激活函数</label>
      <input type="range" id="actSlider" min="0" max="3" step="1" value="0">
      <span class="val" id="actVal">ReLU</span>
    </div>
    <div class="control"><label>初始化</label>
      <input type="range" id="initSlider" min="0" max="4" step="1" value="0">
      <span class="val" id="initVal">He</span>
      <button class="btn btn-gray" id="reinitBtn" title="重新初始化网络">↻</button>
    </div>
    <div class="control"><label>学习率</label>
      <input type="range" id="lrSlider" min="-4" max="-0.3" step="0.01" value="-2.5">
      <span class="val" id="lrVal">0.0032</span>
    </div>
    <div class="control"><label>批量大小</label>
      <input type="range" id="batchSlider" min="1" max="80" step="1" value="8">
      <span class="val" id="batchVal">8</span>
    </div>
    <div class="control"><label>训练速度</label>
      <input type="range" id="speedSlider" min="1" max="60" step="1" value="10">
      <span class="val" id="speedVal">10</span>
    </div>
    <div class="control"><label>样本</label>
      <input type="number" id="sampleIndex" min="0" max="79" value="0">
      <span class="muted" id="sampleLabel">标签: -</span>
    </div>
  </div>
</header>

<div class="controls" style="padding:8px 18px;border-bottom:1px solid var(--line);background:#0e1626;gap:10px">
  <div class="control"><label>模式</label>
    <button class="btn btn-gray active" id="stepModeBtn">单步模式</button>
    <button class="btn btn-green" id="trainBtn">▶ 实时训练</button>
  </div>
  <div class="control step-control" id="stepControl"><label>单步</label>
    <button class="btn btn-blue" id="stepForwardBtn">Forward</button>
    <button class="btn btn-orange" id="stepLossBtn">Loss</button>
    <button class="btn btn-red" id="stepBackwardBtn">Backward</button>
    <button class="btn btn-gray" id="stepUpdateBtn">Update</button>
    <button class="btn btn-gray" id="stepResetBtn">重置</button>
    <span class="muted" id="stepStatus">idle</span>
    <div class="formula-tip" id="stepFormulaTip"></div>
  </div>
</div>


<div id="main">
  <div class="card">
    <h3>网络拓扑 —— 点击隐藏层神经元下钻 28×28 权重热图</h3>
    <canvas id="topologyCanvas" width="1000" height="460"></canvas>
    <div class="legend">
      <span><i class="dot" style="background:#38bdf8"></i>正权重/正梯度</span>
      <span><i class="dot" style="background:#ff6b6b"></i>负权重/负梯度</span>
      <span class="muted">单步 Backward 阶段：连线变为梯度管道（粗细=|梯度|，红=正，蓝=负）</span>
      <span class="muted">默认渲染每层 Top-10 活跃连接（共 30 条）</span>
    </div>
    <div id="drillPanel">
      <canvas id="drillCanvas" width="280" height="280"></canvas>
      <div>
        <div class="muted">下钻对象：<span id="drillInfo">-</span></div>
        <div class="muted" id="drillStats">-</div>
      </div>
    </div>
  </div>
<div class="card">
    <h3>手绘输入 28×28</h3>
    <div class="draw-wrap">
      <canvas id="drawCanvas" width="280" height="280"></canvas>
      <div class="draw-tools">
        <div class="row">
          <button class="btn btn-gray" id="clearDrawBtn">清除</button>
          <button class="btn btn-green" id="addTrainBtn">加入训练集并反向传播</button>
        </div>
        <div class="row">
          <label class="muted">标签</label>
          <select id="drawLabel">
            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
            <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
          </select>
          <span class="muted">推理: <b id="drawPred" style="color:var(--accent)">-</b></span>
        </div>
        <div>
          <div class="muted">输出概率</div>
          <div id="drawBars" style="display:flex;gap:2px;height:26px;align-items:flex-end">
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="bottom">
  <div class="card">
    <h3>训练曲线</h3>
    <canvas id="chartCanvas" width="600" height="280"></canvas>
  </div>
  <div class="card">
    <h3>损失地形图 <span class="muted">（任意两个权重维度）</span></h3>
    <div class="terrain-controls">
      <span class="muted">维1</span>
      <select id="dim1Layer"><option value="W1">W1</option><option value="W2">W2</option><option value="W3" selected>W3</option></select>
      <input type="number" id="dim1Idx" min="0" value="0">
      <span class="muted">维2</span>
      <select id="dim2Layer"><option value="W1">W1</option><option value="W2">W2</option><option value="W3" selected>W3</option></select>
      <input type="number" id="dim2Idx" min="0" value="64">
      <span class="muted">范围</span>
      <input type="range" id="terrainRange" min="0.02" max="1" step="0.01" value="0.2">
      <button class="btn btn-gray" id="terrainRandomBtn">随机</button>
      <button class="btn btn-blue" id="terrainRefreshBtn">刷新地形</button>
    </div>
    <canvas id="terrainCanvas" width="320" height="260"></canvas>
    <div class="legend"><span class="muted" id="terrainInfo">选择两个权重维度后点击刷新。</span></div>
  </div>

</div>

/* ================= 矩阵/数学基础（从零实现） ================= */
function zeros(n) { return new Float32Array(n); }
function argmax(arr) {
  let m = 0;
  for (let i = 1; i < arr.length; i++) if (arr[i] > arr[m]) m = i;
  return m;
}
function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function matVecAdd(W, b, x, out, rows, cols) {
  for (let i = 0; i < rows; i++) {
    let s = b ? b[i] : 0;
    const off = i * cols;
    for (let j = 0; j < cols; j++) s += W[off + j] * x[j];
    out[i] = s;
  }
}
function matTvec(W, dZ, out, rows, cols) {
  // out = W^T * dZ, W shape rows x cols
  for (let j = 0; j < cols; j++) out[j] = 0;
  for (let i = 0; i < rows; i++) {
    const w = W, dz = dZ[i], off = i * cols;
    if (dz === 0) continue;
    for (let j = 0; j < cols; j++) out[j] += w[off + j] * dz;
  }
}
function outerAdd(dW, dZ, a, rows, cols) {
  for (let i = 0; i < rows; i++) {
    const dz = dZ[i];
    if (dz === 0) continue;
    const off = i * cols;
    for (let j = 0; j < cols; j++) dW[off + j] += dz * a[j];
  }
}
function softmax(z) {
  let max = z[0];
  for (let i = 1; i < OUT_DIM; i++) if (z[i] > max) max = z[i];
  const p = zeros(OUT_DIM);
  let sum = 0;
  for (let i = 0; i < OUT_DIM; i++) {
    const e = Math.exp(z[i] - max);
    p[i] = e; sum += e;
  }
  for (let i = 0; i < OUT_DIM; i++) p[i] /= sum;
  return p;
}
function crossEntropy(p, label) {
  return -Math.log(Math.max(p[label], 1e-12));
}

/* ================= 激活函数 ================= */
function activationInto(z, a, act) {
  const n = z.length;
  if (act === 'relu') {
    for (let i = 0; i < n; i++) a[i] = z[i] > 0 ? z[i] : 0;
  } else if (act === 'sigmoid') {
    for (let i = 0; i < n; i++) a[i] = 1 / (1 + Math.exp(-z[i]));
  } else if (act === 'tanh') {
    for (let i = 0; i < n; i++) a[i] = Math.tanh(z[i]);
  } else if (act === 'leakyrelu') {
    for (let i = 0; i < n; i++) a[i] = z[i] > 0 ? z[i] : 0.01 * z[i];
  }
}
function activationPrime(z, a, act) {
  if (act === 'relu') return z > 0 ? 1 : 0;
  if (act === 'sigmoid') return a * (1 - a);
  if (act === 'tanh') return 1 - a * a;
  if (act === 'leakyrelu') return z > 0 ? 1 : 0.01;
  return 1;
}

/* ================= 网络初始化 ================= */
function createNet(strategy, act) {
  return {
    act: act,
    W1: zeros(H1_DIM * INPUT_DIM), b1: zeros(H1_DIM),
    W2: zeros(H2_DIM * H1_DIM), b2: zeros(H2_DIM),
    W3: zeros(OUT_DIM * H2_DIM), b3: zeros(OUT_DIM)
  };
}
function initWeights(net, strategy) {
  const mats = [
    { W: net.W1, fanIn: INPUT_DIM, fanOut: H1_DIM },
    { W: net.W2, fanIn: H1_DIM, fanOut: H2_DIM },
    { W: net.W3, fanIn: H2_DIM, fanOut: OUT_DIM }
  ];
  for (const m of mats) {
    const W = m.W;
    if (strategy === 'zeros') { W.fill(0); continue; }
    for (let i = 0; i < W.length; i++) {
      if (strategy === 'he') {
        const std = Math.sqrt(2 / m.fanIn);
        W[i] = randn() * std;
      } else if (strategy === 'xavier') {
        const limit = Math.sqrt(6 / (m.fanIn + m.fanOut));
        W[i] = (Math.random() * 2 - 1) * limit;
      } else if (strategy === 'uniform') {
        W[i] = (Math.random() * 2 - 1) * 0.1;
      } else if (strategy === 'normal') {
        W[i] = randn() * 0.01;
      }
    }
  }
  net.b1.fill(0); net.b2.fill(0); net.b3.fill(0);
}
function createOptimizer() {
  return {
    vW1: zeros(H1_DIM * INPUT_DIM), vb1: zeros(H1_DIM),
    vW2: zeros(H2_DIM * H1_DIM), vb2: zeros(H2_DIM),
    vW3: zeros(OUT_DIM * H2_DIM), vb3: zeros(OUT_DIM)
  };
}
function resetOptimizer() { opt = createOptimizer(); }

function reinitNetwork() {
  net = createNet(getInitName(), getActivationName());
  initWeights(net, getInitName());
  resetOptimizer();
  edgeAnim = {};
  weightEdges = [];
  gradEdges = [];
  lossHistory = [];
  batchAccHistory = [];
  trainAccHistory = [];
  trainSteps = 0;
  chartsDirty = true;
  terrainLoss = null;
  computeTopWeightEdges();
  showSample(stepSampleIndex);
}

/* ================= 前向传播 ================= */
function forward(net, x) {
  const z1 = zeros(H1_DIM), a1 = zeros(H1_DIM);
  const z2 = zeros(H2_DIM), a2 = zeros(H2_DIM);
  const z3 = zeros(OUT_DIM);
  matVecAdd(net.W1, net.b1, x, z1, H1_DIM, INPUT_DIM);
  activationInto(z1, a1, net.act);
  matVecAdd(net.W2, net.b2, a1, z2, H2_DIM, H1_DIM);
  activationInto(z2, a2, net.act);
  matVecAdd(net.W3, net.b3, a2, z3, OUT_DIM, H2_DIM);
  const probs = softmax(z3);
  return { x, z1, a1, z2, a2, z3, probs };
}

/* ================= 反向传播（链式法则手动展开） ================= */
function createGrads() {
  return {
    dW1: zeros(H1_DIM * INPUT_DIM), db1: zeros(H1_DIM),
    dW2: zeros(H2_DIM * H1_DIM), db2: zeros(H2_DIM),
    dW3: zeros(OUT_DIM * H2_DIM), db3: zeros(OUT_DIM)
  };
}
function backwardInto(net, cache, label, grads) {
  const { x, z1, a1, z2, a2, probs } = cache;
  const dZ3 = zeros(OUT_DIM);
  for (let i = 0; i < OUT_DIM; i++) dZ3[i] = probs[i] - (i === label ? 1 : 0);
  outerAdd(grads.dW3, dZ3, a2, OUT_DIM, H2_DIM);
  for (let i = 0; i < OUT_DIM; i++) grads.db3[i] += dZ3[i];

  const dA2 = zeros(H2_DIM);
  matTvec(net.W3, dZ3, dA2, OUT_DIM, H2_DIM);
  const dZ2 = zeros(H2_DIM);
  for (let i = 0; i < H2_DIM; i++) dZ2[i] = dA2[i] * activationPrime(z2[i], a2[i], net.act);
  outerAdd(grads.dW2, dZ2, a1, H2_DIM, H1_DIM);
  for (let i = 0; i < H2_DIM; i++) grads.db2[i] += dZ2[i];

  const dA1 = zeros(H1_DIM);
  matTvec(net.W2, dZ2, dA1, H2_DIM, H1_DIM);
  const dZ1 = zeros(H1_DIM);
  for (let i = 0; i < H1_DIM; i++) dZ1[i] = dA1[i] * activationPrime(z1[i], a1[i], net.act);
  outerAdd(grads.dW1, dZ1, x, H1_DIM, INPUT_DIM);
  for (let i = 0; i < H1_DIM; i++) grads.db1[i] += dZ1[i];
}
function scaleGrads(grads, s) {
  for (const k in grads) {
    const g = grads[k];
    for (let i = 0; i < g.length; i++) g[i] *= s;
  }
}
function applyGradients(net, grads, lr, momentum, gradScale) {
  const f = lr * gradScale;
  const apply = (W, g, v) => {
    for (let i = 0; i < W.length; i++) {
      v[i] = momentum * v[i] - f * g[i];
      W[i] += v[i];
    }
  };
  apply(net.W1, grads.dW1, opt.vW1);
  apply(net.b1, grads.db1, opt.vb1);
  apply(net.W2, grads.dW2, opt.vW2);
  apply(net.b2, grads.db2, opt.vb2);
  apply(net.W3, grads.dW3, opt.vW3);
  apply(net.b3, grads.db3, opt.vb3);
}

/* ================= 数据 ================= */
function decodeMNISTImages() {
  for (let n = 0; n < MNIST_IMAGES.length; n++) {
    const bin = atob(MNIST_IMAGES[n]);
    const x = zeros(INPUT_DIM);
    for (let j = 0; j < INPUT_DIM; j++) x[j] = bin.charCodeAt(j) / 255.0;
    dataset.push({ x, label: MNIST_LABELS[n], id: 'mnist-' + n });
  }
}
function rebuildOrder() {
  trainOrder = dataset.map((_, i) => i);
  for (let i = trainOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [trainOrder[i], trainOrder[j]] = [trainOrder[j], trainOrder[i]];
  }
  trainPos = 0;
}
function nextBatchIndices(bs) {
  const n = dataset.length;
  if (n === 0) return [];
  if (trainPos + bs > n) {
    rebuildOrder();
  }
  const idxs = trainOrder.slice(trainPos, trainPos + bs);
  trainPos += bs;
  return idxs;
}

/* ================= 单步执行 ================= */
function stepForward() {
  const sample = dataset[stepSampleIndex];
  if (!sample) return;
  stepCache = forward(net, sample.x);
  displayCache = stepCache;
  stepGrads = null;
  stepLoss = 0;
  currentStep = 'forward';
  computeTopWeightEdges();
  updateFormulaHighlight();
  chartsDirty = true;
}
function stepLossFn() {
  if (!stepCache) { stepForward(); }
  stepLoss = crossEntropy(stepCache.probs, dataset[stepSampleIndex].label);
  currentStep = 'loss';
  updateFormulaHighlight();
}
function stepBackward() {
  if (!stepCache) { stepForward(); }
  stepGrads = createGrads();
  backwardInto(net, stepCache, dataset[stepSampleIndex].label, stepGrads);
  currentStep = 'backward';
  computeTopGradEdges();
  updateFormulaHighlight();
}
function stepUpdate() {
  if (!stepGrads) { stepBackward(); }
  applyGradients(net, stepGrads, getLR(), MOMENTUM, 1);
  currentStep = 'update';
  computeTopWeightEdges();
  chartsDirty = true;
  if (drillTarget) renderDrill();
  updateFormulaHighlight();
  // 下一步自动移到下一个样本
  stepSampleIndex = (stepSampleIndex + 1) % dataset.length;
  document.getElementById('sampleIndex').value = stepSampleIndex;
  updateSampleLabel();
}
function stepReset() {
  currentStep = 'idle';
  stepCache = null;
  stepGrads = null;
  stepLoss = 0;
  gradEdges = [];
  if (dataset.length) showSample(stepSampleIndex);
  currentStep = 'idle';
  stepCache = null;
  stepLoss = 0;
  gradEdges = [];
  updateFormulaHighlight();
}
function showSample(idx) {
  if (!dataset.length) return;
  stepSampleIndex = Math.max(0, Math.min(idx, dataset.length - 1));
  document.getElementById('sampleIndex').value = stepSampleIndex;
  updateSampleLabel();
  stepGrads = null;
  stepLoss = 0;
  gradEdges = [];
  stepCache = forward(net, dataset[stepSampleIndex].x);
  displayCache = stepCache;
  currentStep = 'forward';
  computeTopWeightEdges();
  updateFormulaHighlight();
}
function updateSampleLabel() {
  const el = document.getElementById('sampleLabel');
  if (dataset[stepSampleIndex]) el.textContent = '标签: ' + dataset[stepSampleIndex].label;
  else el.textContent = '标签: -';
}

/* ================= 实时训练 ================= */
function getLR() { return Math.pow(10, parseFloat(document.getElementById('lrSlider').value)); }
function getBatchSize() { return Math.max(1, parseInt(document.getElementById('batchSlider').value) || 8); }
function getSpeed() { return Math.max(1, parseInt(document.getElementById('speedSlider').value) || 10); }

function evaluateAccuracy() {
  if (!dataset.length) return 0;
  let correct = 0;
  for (const s of dataset) {
    const p = forward(net, s.x);
    if (argmax(p.probs) === s.label) correct++;
  }
  return correct / dataset.length;
}

function trainBatchStep() {
  if (!dataset.length) return;
  const bs = Math.min(getBatchSize(), dataset.length);
  const idxs = nextBatchIndices(bs);
  const grads = createGrads();
  let lossSum = 0, correct = 0;
  let lastCache = null;
  for (const idx of idxs) {
    const sample = dataset[idx];
    const cache = forward(net, sample.x);
    lastCache = cache;
    lossSum += crossEntropy(cache.probs, sample.label);
    if (argmax(cache.probs) === sample.label) correct++;
    backwardInto(net, cache, sample.label, grads);
  }
  applyGradients(net, grads, getLR(), MOMENTUM, 1 / bs);
  if (lastCache) displayCache = lastCache;
  trainSteps++;
  lossHistory.push(lossSum / bs);
  batchAccHistory.push(correct / bs);
  if (trainSteps % 15 === 0) trainAccHistory.push(evaluateAccuracy());
  else trainAccHistory.push(null);
  computeTopWeightEdges();
  chartsDirty = true;
  capHistory();
  if (drillTarget) renderDrill();
}

function capHistory() {
  if (lossHistory.length > 600) {
    lossHistory.shift();
    batchAccHistory.shift();
    trainAccHistory.shift();
  }
}

function startTraining() {
  if (training) return;
  training = true;
  document.getElementById('trainBtn').textContent = '⏸ 暂停';
  document.getElementById('trainBtn').classList.add('active');
  trainTimer = setTimeout(function loop() {
    if (!training) return;
    trainBatchStep();
    trainTimer = setTimeout(loop, Math.max(16, 1000 / getSpeed()));
  }, 16);
}
function stopTraining() {
  training = false;
  if (trainTimer) { clearTimeout(trainTimer); trainTimer = null; }
  document.getElementById('trainBtn').textContent = '▶ 实时训练';
  document.getElementById('trainBtn').classList.remove('active');
}

/* ================= 拓扑布局与 Top-30 连接 ================= */
const LAYOUT = {
  input: { x: 28, y: 165, cell: 5 },
  h1: { x: 225, y: 125, cols: H1_COLS, rows: H1_ROWS, gapX: 20, gapY: 26 },
  h2: { x: 590, y: 125, cols: H2_COLS, rows: H2_ROWS, gapX: 22, gapY: 26 },
  out: { x: 840, y: 105, barW: 115, barH: 18, gapY: 28 }
};
function layerNodePos(layer, idx) {
  if (layer === 0) {
    const cx = (idx % 28) * LAYOUT.input.cell + LAYOUT.input.cell / 2;
    const cy = Math.floor(idx / 28) * LAYOUT.input.cell + LAYOUT.input.cell / 2;
    return { x: LAYOUT.input.x + cx, y: LAYOUT.input.y + cy };
  } else if (layer === 1) {
    return { x: LAYOUT.h1.x + (idx % H1_COLS) * LAYOUT.h1.gapX, y: LAYOUT.h1.y + Math.floor(idx / H1_COLS) * LAYOUT.h1.gapY };
  } else if (layer === 2) {
    return { x: LAYOUT.h2.x + (idx % H2_COLS) * LAYOUT.h2.gapX, y: LAYOUT.h2.y + Math.floor(idx / H2_COLS) * LAYOUT.h2.gapY };
  } else {
    return { x: LAYOUT.out.x, y: LAYOUT.out.y + idx * LAYOUT.out.gapY };
  }
}
function edgeKey(e) { return e.layer + '_' + e.i + '_' + e.j; }
function scanTopK(W, layer, k) {
  const rows = layer === 1 ? H1_DIM : (layer === 2 ? H2_DIM : OUT_DIM);
  const cols = layer === 1 ? INPUT_DIM : (layer === 2 ? H1_DIM : H2_DIM);
  const top = [];
  for (let i = 0; i < rows; i++) {
    const off = i * cols;
    for (let j = 0; j < cols; j++) {
      const v = W[off + j];
      const av = Math.abs(v);
      const e = { layer, i, j, v, av };
      if (top.length < k) {
        top.push(e);
      } else {
        let minM = 0;
        for (let m = 1; m < k; m++) if (top[m].av < top[minM].av) minM = m;
        if (av > top[minM].av) top[minM] = e;
      }
    }
  }
  return top;
}
function pruneEdgeAnim() {
  const keep = {};
  for (const e of weightEdges) keep[edgeKey(e)] = true;
  for (const e of gradEdges) keep[edgeKey(e)] = true;
  for (const k in edgeAnim) if (!keep[k]) delete edgeAnim[k];
}
function scanTopKScored(W, layer, k, pre) {
  const rows = layer === 1 ? H1_DIM : (layer === 2 ? H2_DIM : OUT_DIM);
  const cols = layer === 1 ? INPUT_DIM : (layer === 2 ? H1_DIM : H2_DIM);
  const top = [];
  for (let i = 0; i < rows; i++) {
    const off = i * cols;
    for (let j = 0; j < cols; j++) {
      const v = W[off + j];
      const av = Math.abs(v) * (pre ? Math.abs(pre[j]) : 1);
      const e = { layer, i, j, v, av };
      if (top.length < k) {
        top.push(e);
      } else {
        let minM = 0;
        for (let m = 1; m < k; m++) if (top[m].av < top[minM].av) minM = m;
        if (av > top[minM].av) top[minM] = e;
      }
    }
  }
  return top;
}
function computeTopWeightEdges() {
  if (!net) return;
  const pre1 = displayCache ? displayCache.x : null;
  const pre2 = displayCache ? displayCache.a1 : null;
  const pre3 = displayCache ? displayCache.a2 : null;
  if (pre1 && pre2 && pre3) {
    // 正常模式：按“活跃度 = |权重| × 前一层激活值”选择 Top 连接，随输入/激活实时变化
    weightEdges = scanTopKScored(net.W1, 1, TOP_K_PER_LAYER, pre1)
      .concat(scanTopKScored(net.W2, 2, TOP_K_PER_LAYER, pre2))
      .concat(scanTopKScored(net.W3, 3, TOP_K_PER_LAYER, pre3));
  } else {
    weightEdges = scanTopK(net.W1, 1, TOP_K_PER_LAYER)
      .concat(scanTopK(net.W2, 2, TOP_K_PER_LAYER))
      .concat(scanTopK(net.W3, 3, TOP_K_PER_LAYER));
  }
  pruneEdgeAnim();
}
function computeTopGradEdges() {
  if (!stepGrads) return;
  gradEdges = scanTopK(stepGrads.dW1, 1, TOP_K_PER_LAYER)
    .concat(scanTopK(stepGrads.dW2, 2, TOP_K_PER_LAYER))
    .concat(scanTopK(stepGrads.dW3, 3, TOP_K_PER_LAYER));
  pruneEdgeAnim();
}

/* ================= 拓扑绘制 ================= */
const topoCanvas = document.getElementById('topologyCanvas');
const topoCtx = topoCanvas.getContext('2d');

function edgePoints(e) {
  const p1 = layerNodePos(e.layer - 1, e.j);
  const p2 = layerNodePos(e.layer, e.i);
  return [p1.x, p1.y, p2.x, p2.y];
}
function drawEdges(ctx, edges, gradMode) {
  if (!edges || edges.length === 0) return;
  let max = 0;
  for (const e of edges) if (e.av > max) max = e.av;
  if (max === 0) max = 1;
  for (let ei = 0; ei < edges.length; ei++) {
    const e = edges[ei];
    const key = edgeKey(e);
    let cur = edgeAnim[key];
    if (cur === undefined) cur = e.av;
    cur += (e.av - cur) * 0.18;
    edgeAnim[key] = cur;
    const norm = Math.min(1, cur / max);
    ctx.lineWidth = gradMode ? 0.4 + 5.5 * norm : Math.max(1.2, 0.6 + 3.4 * norm);
    if (gradMode) {
      ctx.strokeStyle = e.v >= 0 ? 'rgba(255,77,79,0.92)' : 'rgba(77,124,255,0.92)';
    } else {
      ctx.strokeStyle = e.v >= 0 ? 'rgba(56,189,248,0.85)' : 'rgba(255,107,107,0.85)';
    }
    const [x1, y1, x2, y2] = edgePoints(e);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}
function drawInputGrid(ctx, input) {
  const { x, y, cell } = LAYOUT.input;
  for (let r = 0; r < 28; r++) {
    for (let c = 0; c < 28; c++) {
      const v = input ? input[r * 28 + c] : 0;
      ctx.fillStyle = `rgb(${Math.round(v * 255)},${Math.round(v * 255)},${Math.round(v * 255)})`;
      ctx.fillRect(x + c * cell, y + r * cell, cell + 0.5, cell + 0.5);
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x, y, 28 * cell, 28 * cell);
  ctx.fillStyle = '#8aa0b8';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('输入层 28×28', x + 70, y + 28 * cell + 16);
}
function drawHiddenLayer(ctx, layer, acts) {
  const conf = layer === 1 ? LAYOUT.h1 : LAYOUT.h2;
  const cols = layer === 1 ? H1_COLS : H2_COLS;
  const rows = layer === 1 ? H1_ROWS : H2_ROWS;
  for (let i = 0; i < cols * rows; i++) {
    const p = layerNodePos(layer, i);
    const a = acts ? acts[i] : 0;
    const r = 3 + 7 * Math.min(1, Math.max(0, a));
    const hue = 195;
    const light = 45 + 30 * Math.min(1, Math.max(0, a));
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${hue}, 90%, ${light}%)`;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  const label = layer === 1 ? '隐藏层 1 · 128' : '隐藏层 2 · 64';
  ctx.fillStyle = '#8aa0b8';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, (layer === 1 ? LAYOUT.h1.x : LAYOUT.h2.x) + (cols - 1) * conf.gapX / 2, LAYOUT.h1.y + (rows - 1) * conf.gapY + 24);
}
function drawOutputLayer(ctx, probs) {
  const { x, y, barW, barH, gapY } = LAYOUT.out;
  const pred = probs ? argmax(probs) : -1;
  ctx.fillStyle = '#8aa0b8';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('输出层 10', x + barW / 2, y - 12);
  for (let i = 0; i < OUT_DIM; i++) {
    const p = probs ? probs[i] : 0;
    const by = y + i * gapY;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x, by, barW, barH);
    const w = p * barW;
    ctx.fillStyle = i === pred ? '#38bdf8' : '#0ea5e9';
    ctx.fillRect(x, by, w, barH);
    ctx.strokeStyle = i === pred ? '#bae6fd' : '#334155';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, by, barW, barH);
    ctx.fillStyle = i === pred ? '#fff' : '#94a3b8';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(i, x - 6, by + barH - 5);
    ctx.textAlign = 'left';
    ctx.fillText((p * 100).toFixed(1) + '%', x + 6, by + barH - 5);
  }
}
function renderTopology() {
  const ctx = topoCtx;
  ctx.fillStyle = '#0a1424';
  ctx.fillRect(0, 0, topoCanvas.width, topoCanvas.height);
  const acts1 = displayCache ? displayCache.a1 : null;
  const acts2 = displayCache ? displayCache.a2 : null;
  const probs = displayCache ? displayCache.probs : null;
  const input = displayCache ? displayCache.x : drawingData;
  drawInputGrid(ctx, input);
  if (currentStep === 'backward' && gradEdges.length) drawEdges(ctx, gradEdges, true);
  else drawEdges(ctx, weightEdges, false);
  drawHiddenLayer(ctx, 1, acts1);
  drawHiddenLayer(ctx, 2, acts2);
  drawOutputLayer(ctx, probs);
}

/* ================= 下钻 28×28 权重热图 ================= */
const drillCanvas = document.getElementById('drillCanvas');
const drillCtx = drillCanvas.getContext('2d');
function renderDrill() {
  if (!drillTarget || !net) return;
  const { layer, index } = drillTarget;
  const heat = zeros(INPUT_DIM);
  if (layer === 1) {
    for (let j = 0; j < INPUT_DIM; j++) heat[j] = net.W1[index * INPUT_DIM + j];
  } else if (layer === 2) {
    for (let k = 0; k < H1_DIM; k++) {
      const w2 = net.W2[index * H1_DIM + k];
      if (w2 === 0) continue;
      for (let j = 0; j < INPUT_DIM; j++) heat[j] += w2 * net.W1[k * INPUT_DIM + j];
    }
  } else {
    return;
  }
  let max = 0;
  for (let j = 0; j < INPUT_DIM; j++) { const av = Math.abs(heat[j]); if (av > max) max = av; }
  if (max === 0) max = 1;
  drillCtx.fillStyle = '#000';
  drillCtx.fillRect(0, 0, 280, 280);
  const cell = 10;
  for (let r = 0; r < 28; r++) {
    for (let c = 0; c < 28; c++) {
      const v = heat[r * 28 + c] / max;
      const a = Math.min(1, Math.abs(v));
      let col;
      if (v >= 0) col = `rgba(255,80,80,${a})`;
      else col = `rgba(70,120,255,${a})`;
      drillCtx.fillStyle = col;
      drillCtx.fillRect(c * cell, r * cell, cell, cell);
    }
  }
  const act = (layer === 1 && displayCache) ? displayCache.a1[index] : ((layer === 2 && displayCache) ? displayCache.a2[index] : 0);
  document.getElementById('drillInfo').textContent = `隐藏层${layer} 神经元 #${index}（激活值 ${act.toFixed(3)}）`;
  document.getElementById('drillStats').textContent = `权重/复合权重范围: [${(-max).toFixed(3)}, ${max.toFixed(3)}]，红=正，蓝=负`;
  document.getElementById('drillPanel').classList.add('show');
}

/* ================= 训练曲线 ================= */
const chartCanvas = document.getElementById('chartCanvas');
const chartCtx = chartCanvas.getContext('2d');
function renderCharts() {
  const W = chartCanvas.width, H = chartCanvas.height;
  const ctx = chartCtx;
  ctx.fillStyle = '#0a1424';
  ctx.fillRect(0, 0, W, H);
  if (!lossHistory.length) {
    ctx.fillStyle = '#64748b';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无训练数据', W / 2, H / 2);
    return;
  }
  const padL = 40, padR = 16, padT = 18, padB = 24;
  const n = lossHistory.length;
  let maxLoss = 0;
  for (let i = 0; i < n; i++) if (lossHistory[i] > maxLoss) maxLoss = lossHistory[i];
  if (maxLoss <= 0) maxLoss = 1;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  // 网格
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gy = padT + plotH * g / 4;
    ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
  }
  // Y轴（loss）
  ctx.fillStyle = '#fb7185';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let g = 0; g <= 4; g++) {
    const gy = padT + plotH * g / 4;
    ctx.fillText((maxLoss * (1 - g / 4)).toFixed(2), padL - 6, gy + 3);
  }
  // 准确率轴右侧
  ctx.textAlign = 'left';
  for (let g = 0; g <= 4; g++) {
    const gy = padT + plotH * g / 4;
    ctx.fillStyle = '#38bdf8';
    ctx.fillText((100 * (1 - g / 4)).toFixed(0) + '%', W - padR + 4, gy + 3);
  }
  ctx.strokeStyle = '#1e293b';
  ctx.strokeRect(padL, padT, plotW, plotH);
  // 曲线
  const px = (i) => padL + (n === 1 ? plotW : plotW * i / (n - 1));
  const pyLoss = (v) => padT + plotH * (1 - v / maxLoss);
  const pyAcc = (v) => padT + plotH * (1 - v);
  // 损失
  ctx.strokeStyle = '#fb7185';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = px(i), y = pyLoss(lossHistory[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // 训练准确率（全量）
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < trainAccHistory.length; i++) {
    if (trainAccHistory[i] === null) continue;
    const x = px(i), y = pyAcc(trainAccHistory[i]);
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // 批量准确率（淡）
  ctx.strokeStyle = 'rgba(56,189,248,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < batchAccHistory.length; i++) {
    const x = px(i), y = pyAcc(batchAccHistory[i]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  // 图例
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#fb7185';
  ctx.textAlign = 'left';
  ctx.fillText('— Loss', padL + 10, padT - 6);
  ctx.fillStyle = '#38bdf8';
  ctx.fillText('— Acc', padL + 70, padT - 6);
}

/* ================= 损失地形图 ================= */
const terrainCanvas = document.getElementById('terrainCanvas');
const terrainCtx = terrainCanvas.getContext('2d');
function getWeightRef(layerName, idx) {
  const mat = net[layerName];
  const i = Math.max(0, Math.min(Math.floor(idx) || 0, mat.length - 1));
  return { get: () => mat[i], set: (v) => { mat[i] = v; }, name: layerName + '[' + i + ']' };
}
function terrainLayerMax(layerName) { return net[layerName].length - 1; }
function updateTerrainIndexBounds() {
  document.getElementById('dim1Idx').max = terrainLayerMax(document.getElementById('dim1Layer').value);
  document.getElementById('dim2Idx').max = terrainLayerMax(document.getElementById('dim2Layer').value);
}
function computeTerrain() {
  if (!net || dataset.length === 0 || terrainComputing) return;
  const wasTraining = training;
  if (wasTraining) stopTraining();
  terrainComputing = true;
  setTimeout(() => {
    try {
      const layer1 = document.getElementById('dim1Layer').value;
      const layer2 = document.getElementById('dim2Layer').value;
      updateTerrainIndexBounds();
      const r1 = getWeightRef(layer1, parseInt(document.getElementById('dim1Idx').value) || 0);
      const r2 = getWeightRef(layer2, parseInt(document.getElementById('dim2Idx').value) || 0);
      const orig1 = r1.get(), orig2 = r2.get();
      const range = parseFloat(document.getElementById('terrainRange').value) || 0.2;
      const N = 18;
      const sample = dataset[Math.min(stepSampleIndex, dataset.length - 1)];
      const grid = zeros(N * N);
      let min = Infinity, max = -Infinity;
      for (let gy = 0; gy < N; gy++) {
        const w2 = orig2 - range + 2 * range * gy / (N - 1);
        r2.set(w2);
        for (let gx = 0; gx < N; gx++) {
          const w1 = orig1 - range + 2 * range * gx / (N - 1);
          r1.set(w1);
          const p = forward(net, sample.x);
          const loss = crossEntropy(p.probs, sample.label);
          grid[gy * N + gx] = loss;
          if (loss < min) min = loss;
          if (loss > max) max = loss;
        }
      }
      r1.set(orig1); r2.set(orig2);
      terrainLoss = { grid, N, min, max, name1: r1.name, name2: r2.name, orig1, orig2 };
      renderTerrain();
      document.getElementById('terrainInfo').textContent = `${r1.name} × ${r2.name}，loss ∈ [${min.toFixed(2)}, ${max.toFixed(2)}]`;
    } finally {
      terrainComputing = false;
      if (wasTraining) startTraining();
    }
  }, 30);
}
function renderTerrain() {
  const W = terrainCanvas.width, H = terrainCanvas.height;
  const ctx = terrainCtx;
  ctx.fillStyle = '#0a1424';
  ctx.fillRect(0, 0, W, H);
  if (!terrainLoss) {
    ctx.fillStyle = '#64748b';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('点击“刷新地形”', W / 2, H / 2);
    return;
  }
  const { grid, N, min, max } = terrainLoss;
  const padL = 34, padR = 10, padT = 10, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const cellW = plotW / N, cellH = plotH / N;
  const span = max - min || 1;
  for (let gy = 0; gy < N; gy++) {
    for (let gx = 0; gx < N; gx++) {
      const v = grid[gy * N + gx];
      const t = (v - min) / span;
      // 深蓝->青->黄
      let r, g, b;
      if (t < 0.5) {
        const u = t / 0.5;
        r = Math.round(15 + 15 * u); g = Math.round(25 + 140 * u); b = Math.round(90 + 130 * u);
      } else {
        const u = (t - 0.5) / 0.5;
        r = Math.round(30 + 225 * u); g = Math.round(165 + 85 * u); b = Math.round(220 - 190 * u);
      }
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(padL + gx * cellW, padT + gy * cellH, cellW + 0.5, cellH + 0.5);
    }
  }
  ctx.strokeStyle = '#334155';
  ctx.strokeRect(padL, padT, plotW, plotH);
  // 叠加等高线
  const levels = [0.15, 0.35, 0.5, 0.65, 0.85];
  ctx.lineWidth = 0.6;
  for (const L of levels) {
    const level = min + L * span;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    let segs = 0;
    for (let gy = 0; gy < N - 1; gy++) {
      for (let gx = 0; gx < N - 1; gx++) {
        const v00 = grid[gy * N + gx], v10 = grid[gy * N + gx + 1];
        const v01 = grid[(gy + 1) * N + gx], v11 = grid[(gy + 1) * N + gx + 1];
        const x0 = padL + gx * cellW, y0 = padT + gy * cellH;
        const x1 = padL + (gx + 1) * cellW, y1 = padT + (gy + 1) * cellH;
        const lerp = (va, vb) => va === vb ? 0.5 : (level - va) / (vb - va);
        const a00 = v00 >= level, a10 = v10 >= level, a01 = v01 >= level, a11 = v11 >= level;
        const sum = a00 + a10 + a01 + a11;
        if (sum === 0 || sum === 4) continue;
        const p = [];
        if (a00 !== a10) { const t = lerp(v00, v10); p.push({ x: x0 + t * (x1 - x0), y: y0 }); }
        if (a10 !== a11) { const t = lerp(v10, v11); p.push({ x: x1, y: y0 + t * (y1 - y0) }); }
        if (a11 !== a01) { const t = lerp(v11, v01); p.push({ x: x1 - t * (x1 - x0), y: y1 }); }
        if (a01 !== a00) { const t = lerp(v01, v00); p.push({ x: x0, y: y1 - t * (y1 - y0) }); }
        if (p.length === 2) {
          ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y); segs++;
        } else if (p.length >= 3) {
          ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y);
          ctx.moveTo(p[2].x, p[2].y); ctx.lineTo(p[3].x, p[3].y); segs++;
        }
      }
    }
    if (segs > 0) ctx.stroke();
  }
  // 标注当前权重位置（中心）
  const cx = padL + plotW / 2, cy = padT + plotH / 2;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
  ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(terrainLoss.name1, padL + 4, padT + 12);
  ctx.textAlign = 'right';
  ctx.fillText(terrainLoss.name2, W - padR - 4, padT + plotH - 6);
}

/* ================= 公式提示（按钮 hover） ================= */
function updateFormulaHighlight() {
  document.getElementById('stepStatus').textContent = currentStep;
}
function showStepFormula(step) {
  const tip = document.getElementById('stepFormulaTip');
  const list = STEP_FORMULAS[step] || [];
  tip.innerHTML = list.map(f => `<div class="formula">${f}</div>`).join('');
  tip.classList.add('show');
}
function hideStepFormula() {
  document.getElementById('stepFormulaTip').classList.remove('show');
}

/* ================= 手绘输入 ================= */
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');
const drawBarsEl = document.getElementById('drawBars');
let drawBars = [];
for (let i = 0; i < OUT_DIM; i++) {
  const b = document.createElement('div');
  b.style.cssText = 'flex:1;background:#0ea5e9;border-radius:2px;transition:height .08s;height:2px';
  drawBarsEl.appendChild(b);
  drawBars.push(b);
}
function renderDrawCanvas() {
  drawCtx.fillStyle = '#000';
  drawCtx.fillRect(0, 0, 280, 280);
  const cell = 10;
  for (let r = 0; r < 28; r++) {
    for (let c = 0; c < 28; c++) {
      const v = drawingData[r * 28 + c];
      if (v > 0) {
        drawCtx.fillStyle = `rgb(${Math.round(v * 255)},${Math.round(v * 255)},${Math.round(v * 255)})`;
        drawCtx.fillRect(c * cell, r * cell, cell, cell);
      }
    }
  }
  drawCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  drawCtx.lineWidth = 1;
  for (let i = 0; i <= 28; i++) {
    drawCtx.beginPath(); drawCtx.moveTo(i * cell, 0); drawCtx.lineTo(i * cell, 280); drawCtx.stroke();
    drawCtx.beginPath(); drawCtx.moveTo(0, i * cell); drawCtx.lineTo(280, i * cell); drawCtx.stroke();
  }
}
function getDrawCell(ev) {
  const rect = drawCanvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * 28;
  const y = (ev.clientY - rect.top) / rect.height * 28;
  return { x: Math.max(0, Math.min(27, Math.floor(x))), y: Math.max(0, Math.min(27, Math.floor(y))) };
}
function paintLine(x0, y0, x1, y1, radius) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) + 1;
  for (let s = 0; s <= steps; s++) {
    const t = s / steps;
    const cx = Math.round(x0 + (x1 - x0) * t);
    const cy = Math.round(y0 + (y1 - y0) * t);
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx * dx + dy * dy > radius * radius + 0.5) continue;
        const nx = cx + dx, ny = cy + dy;
        if (nx >= 0 && nx < 28 && ny >= 0 && ny < 28) {
          drawingData[ny * 28 + nx] = Math.min(1, drawingData[ny * 28 + nx] + 0.85);
        }
      }
    }
  }
}
function scheduleDrawInference() {
  if (drawInferPending) return;
  drawInferPending = true;
  requestAnimationFrame(() => {
    if (net) {
      const cache = forward(net, drawingData);
      displayCache = cache;
      computeTopWeightEdges();
      drawProbs = cache.probs;
      drawPred = argmax(drawProbs);
      document.getElementById('drawPred').textContent = drawPred;
      const maxP = Math.max(...drawProbs);
      for (let i = 0; i < OUT_DIM; i++) {
        drawBars[i].style.height = (drawProbs[i] / maxP * 22 + 2) + 'px';
        drawBars[i].style.background = i === drawPred ? '#38bdf8' : '#0ea5e9';
      }
    }
    drawInferPending = false;
  });
}
let drawing = false, lastDraw = null;
drawCanvas.addEventListener('pointerdown', ev => {
  drawing = true;
  if (drawCanvas.setPointerCapture) { try { drawCanvas.setPointerCapture(ev.pointerId); } catch(e){} }
  lastDraw = getDrawCell(ev);
  paintLine(lastDraw.x, lastDraw.y, lastDraw.x, lastDraw.y, 1);
  renderDrawCanvas();
  scheduleDrawInference();
});
drawCanvas.addEventListener('pointermove', ev => {
  if (!drawing) return;
  const c = getDrawCell(ev);
  paintLine(lastDraw.x, lastDraw.y, c.x, c.y, 1);
  lastDraw = c;
  renderDrawCanvas();
  scheduleDrawInference();
});
drawCanvas.addEventListener('pointerup', () => { drawing = false; });
drawCanvas.addEventListener('pointerleave', () => { drawing = false; });
function clearDraw() {
  drawingData.fill(0);
  renderDrawCanvas();
  drawPred = -1;
  document.getElementById('drawPred').textContent = '-';
  for (let i = 0; i < OUT_DIM; i++) drawBars[i].style.height = '2px';
}
function addDrawingToTraining() {
  const sum = drawingData.reduce((a, b) => a + b, 0);
  if (sum < 2) { alert('请先在手绘画布上写一个数字'); return; }
  const label = parseInt(document.getElementById('drawLabel').value);
  const x = new Float32Array(drawingData);
  dataset.push({ x, label, id: 'draw-' + Date.now() });
  rebuildOrder();
  document.getElementById('sampleIndex').max = dataset.length - 1;
  const grads = createGrads();
  const cache = forward(net, x);
  const loss = crossEntropy(cache.probs, label);
  backwardInto(net, cache, label, grads);
  applyGradients(net, grads, getLR(), MOMENTUM, 1);
  displayCache = cache;
  trainSteps++;
  lossHistory.push(loss);
  batchAccHistory.push(argmax(cache.probs) === label ? 1 : 0);
  trainAccHistory.push(null);
  computeTopWeightEdges();
  chartsDirty = true;
  capHistory();
  currentStep = 'update';
  updateFormulaHighlight();
  document.getElementById('terrainInfo').textContent = '已加入训练集并执行一次 SGD 更新。';
}

/* ================= UI 事件与初始化 ================= */
function updateLRDisplay() {
  document.getElementById('lrVal').textContent = getLR().toFixed(4);
}
function updateBatchDisplay() {
  document.getElementById('batchVal').textContent = getBatchSize();
}
function updateSpeedDisplay() {
  document.getElementById('speedVal').textContent = getSpeed();
}
function updateStepStatus() {
  document.getElementById('stepStatus').textContent = currentStep;
}
function bindUI() {
  document.getElementById('lrSlider').addEventListener('input', updateLRDisplay);
  document.getElementById('batchSlider').addEventListener('input', updateBatchDisplay);
  document.getElementById('speedSlider').addEventListener('input', updateSpeedDisplay);
  document.getElementById('sampleIndex').addEventListener('change', e => {
    showSample(parseInt(e.target.value) || 0);
  });
  document.getElementById('actSlider').addEventListener('input', updateActInitDisplay);
  document.getElementById('actSlider').addEventListener('change', reinitNetwork);
  document.getElementById('initSlider').addEventListener('input', updateActInitDisplay);
  document.getElementById('initSlider').addEventListener('change', reinitNetwork);
  document.getElementById('reinitBtn').addEventListener('click', reinitNetwork);

  document.getElementById('stepModeBtn').addEventListener('click', () => {
    stopTraining();
    document.getElementById('stepModeBtn').classList.add('active');
    stepReset();
  });
  document.getElementById('trainBtn').addEventListener('click', () => {
    if (training) {
      stopTraining();
      document.getElementById('stepModeBtn').classList.add('active');
      currentStep = 'idle';
      updateFormulaHighlight();
    } else {
      document.getElementById('stepModeBtn').classList.remove('active');
      currentStep = 'train';
      updateFormulaHighlight();
      startTraining();
    }
  });
  document.getElementById('stepForwardBtn').addEventListener('click', stepForward);
  document.getElementById('stepLossBtn').addEventListener('click', stepLossFn);
  document.getElementById('stepBackwardBtn').addEventListener('click', stepBackward);
  document.getElementById('stepUpdateBtn').addEventListener('click', stepUpdate);
  document.getElementById('stepResetBtn').addEventListener('click', stepReset);
  document.getElementById('stepForwardBtn').addEventListener('mouseenter', () => showStepFormula('forward'));
  document.getElementById('stepLossBtn').addEventListener('mouseenter', () => showStepFormula('loss'));
  document.getElementById('stepBackwardBtn').addEventListener('mouseenter', () => showStepFormula('backward'));
  document.getElementById('stepUpdateBtn').addEventListener('mouseenter', () => showStepFormula('update'));
  document.getElementById('stepControl').addEventListener('mouseleave', hideStepFormula);

  document.getElementById('clearDrawBtn').addEventListener('click', clearDraw);
  document.getElementById('addTrainBtn').addEventListener('click', addDrawingToTraining);

  document.getElementById('dim1Layer').addEventListener('change', updateTerrainIndexBounds);
  document.getElementById('dim2Layer').addEventListener('change', updateTerrainIndexBounds);
  document.getElementById('terrainRandomBtn').addEventListener('click', () => {
    const layers = ['W1', 'W2', 'W3'];
    const l1 = layers[Math.floor(Math.random() * 3)];
    const l2 = layers[Math.floor(Math.random() * 3)];
    document.getElementById('dim1Layer').value = l1;
    document.getElementById('dim2Layer').value = l2;
    updateTerrainIndexBounds();
    document.getElementById('dim1Idx').value = Math.floor(Math.random() * (terrainLayerMax(l1) + 1));
    document.getElementById('dim2Idx').value = Math.floor(Math.random() * (terrainLayerMax(l2) + 1));
    computeTerrain();
  });
  document.getElementById('terrainRefreshBtn').addEventListener('click', computeTerrain);

  topoCanvas.addEventListener('click', ev => {
    const rect = topoCanvas.getBoundingClientRect();
    const x = (ev.clientX - rect.left) * topoCanvas.width / rect.width;
    const y = (ev.clientY - rect.top) * topoCanvas.height / rect.height;
    let best = null, bestD = 18;
    for (const layer of [1, 2]) {
      const count = layer === 1 ? H1_DIM : H2_DIM;
      for (let i = 0; i < count; i++) {
        const p = layerNodePos(layer, i);
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < bestD) { bestD = d; best = { layer, index: i }; }
      }
    }
    if (best) {
      drillTarget = best;
      renderDrill();
    }
  });
}
function init() {
  decodeMNISTImages();
  rebuildOrder();
  reinitNetwork();
  updateLRDisplay();
  updateBatchDisplay();
  updateSpeedDisplay();
  updateActInitDisplay();
  updateTerrainIndexBounds();
  bindUI();
  renderDrawCanvas();
  clearDraw();
  function loop() {
    renderTopology();
    if (chartsDirty) { renderCharts(); chartsDirty = false; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
init();
</script>
