name: Build & Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 按 scad 源文件 hash 缓存转换产物；命中时跳过 openscad 安装与转换
      # 不设 restore-keys：scad 变化时整批重建，避免新旧模型混杂
      - name: Cache model outputs
        id: outputs
        uses: actions/cache@v6
        with:
          path: |
            _site/models
            _site/assets/thumbs
          key: model-outputs-${{ hashFiles('scad/*.scad') }}

      - name: Install OpenSCAD
        if: steps.outputs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Convert SCAD -> GLB + thumbnails
        if: steps.outputs.outputs.cache-hit != 'true'
        run: uv run scad/convert.py

      - name: Build site pages
        run: uv run tools/build_index.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
