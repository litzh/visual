# 站点索引：AI 生成产物清单
# 字段说明：
#   file     文件名（相对各自目录）
#   title    展示标题
#   prompt   生成时使用的提示词列表（按对话轮次排列；单轮可只写一项）
#   model    生成模型，如 deepseek-v4-pro-0813
#   effort   推理强度，如 max
#   harness  生成环境，如 pi / dsh
#   preset   harness 预设，如 default / anchored-standard
#   date     生成日期
#   note     备注（如版本迭代关系）

title: AI 生成作品集
description: 使用 AI 生成的网页应用、矢量图与 3D 模型

html:
  - file: simple-c-language.html
    title: C语言可视化
    prompt: 
      - >
        忽略当前目录下其他文件。
        请开发一个可以直接在现代浏览器中打开运行的单页面应用，所有 HTML、CSS 和 JavaScript 都放在一个 index.html 文件中，不使用服务器、构建工具、外部库或网络资源。
        应用是一个“32 位 x86 风格的 C 子集解释器与可视化调试器”。它不需要生成或执行真实机器码，但必须使用确定性的 32 位小端内存模型，并展示类似 x86 的寄存器和栈帧状态。
        功能要求：
        1. 提供 C 代码编辑区、输出控制台、错误信息区。
        2. 支持以下 C 子集：
        - int、char、void
        - 局部变量和全局变量
        - 整数与字符常量
        - 算术、比较、逻辑和位运算
        - 赋值、++、--
        - if/else、while、for
        - 函数定义、函数调用和 return
        - 一维数组
        - int/char 指针、& 和 *
        - // 与 /* */ 注释
        - printf，至少支持 %d、%x、%c、%s
        3. 使用 32 位补码整数语义；内存按字节寻址并采用小端序。
        4. 模拟并显示 EAX、EBX、ECX、EDX、ESI、EDI、ESP、EBP、EIP。寄存器变化必须有高亮；不要求和真实编译器生成的 x86 指令完全一致，但规则必须明确且前后一致。
        5. 显示内存视图、调用栈、局部变量及其地址和值。支持按地址查看内存，并高亮最近一次读写的位置。
        6. 支持运行、暂停、单步、重置。单步以 C 语句或表达式为粒度，并高亮当前源代码位置。
        7. 对语法错误、未定义变量、非法指针、数组越界、除零和执行步数过多给出清晰错误。
        8. 页面加载后提供至少三个可运行示例：
        - 循环与整数运算
        - 函数调用和递归
        - 数组与指针
        9. 界面使用深色调试器风格，桌面端布局清晰，也能在较窄窗口中使用。
        10. 禁止使用 eval、Function 构造器或把输入代码转换成 JavaScript 执行。应自行实现 tokenizer、parser 和 interpreter。
        11. 设置执行步数上限，避免死循环冻结页面。运行期间界面应保持可响应。
        12. 在代码中清楚划分 lexer、parser、runtime/interpreter、memory model 和 UI，不需要实现完整 ISO C。
        页面需要说明支持的范围，现在直接完成 index.html。完成后自行运行测试示例，修复语法错误和明显的执行问题。不要将尚未实现的功能显示为已支持。
      - "单步运行的时候，循环内的语句在编辑器内没有一行一行执行，比如你给的数组与指针的例子，单步运行时一直是高亮的for这一行，内部的两行都没有高亮，但是右侧的可视化是正确的。"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-20
