# 站点索引：AI 生成产物清单
# 字段说明：
#   file     文件名（相对各自目录）
#   title    展示标题
#   prompt   生成时使用的提示词列表（按对话轮次排列；单轮可只写一项）
#   model    生成模型，如 deepseek-v4-pro-0813
#   effort   推理强度，如 max
#   harness  生成环境，如 pi / dsh
#   preset   harness 预设，如 default / anchored-standard
#   date     生成日期
#   note     备注（如版本迭代关系）

title: AI 生成作品集
description: 使用 AI 生成的网页应用、矢量图与 3D 模型

html:
  - file: solar-system.html
    title: 太阳系三维演示模拟
    prompt: 
      - "忽略当前目录下的文件，用单个HTML 开发一个太阳系的演示模拟页面，越详细、越精确越好，直接开发"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "default"
    date: 2026-08-16
  - file: logic-circuit-simulator.html
    title: 逻辑电路模模拟器
    prompt: 
      - "测试，回复OK"
      - "在 html 目录下创建一个 html 文件，用单个文件实现一个逻辑电路模拟器，用户可以自己组建、测试电路，直接开发，不用问我"
      - "默认的半加法器，异或门和L1之间连线、与门与L2之间的连线，在输入高电平的时候会消失而不是发光。"
      - "连线功能不正常，点击输出引脚之后，不松开鼠标按键可以看到线，并且连接到了输出引脚上，但是鼠标移动到输入引脚后没有连接上，松开鼠标线就消失了。"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "anchored-standard"
    date: 2026-08-16
  - file: logic-circuit-simulator-v2.html
    title: 逻辑电路模拟器 v2
    prompt: 
      - "参考逻辑电路模拟器"
      - "如果要加入记忆功能是时钟功能，还需要添加哪些器件？"
      - "你在现在的基础上开发这些功能，不过保存到 html/logic-circuit-simulator-v2.html 里面，原来的文件不要动了"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "anchored-standard"
    date: 2026-08-16
    note: logic-circuit-simulator 的 v2 迭代版
  - file: sorting-visualization.html
    title: 排序算法可视化
    prompt: 
      - "忽略当前目录下的文件，创建单个HTML文件，可视化演示归并排序、希尔排序、快速排序、堆排序"
      - "需要同屏展示4个，可以同时运行比较速度"
      - "1. 2x2的网格；2. 按你的方案"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "anchored-standard"
    date: 2026-08-16
  - file: buffon-needle.html
    title: 蒲丰投针实验
    prompt: 
      - "在当前页面下创建一个HTML文件，可视化模拟蒲丰投针实验"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-15
  - file: reservoir-sampling.html
    title: 蓄水池抽样
    prompt: 
      - "在当前页面下创建一个HTML文件，用来进行算法可视化，实现一个蓄水池抽样的可视化"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-15
  - file: circle-similarity.html
    title: 闭合曲线圆形度评分器
    prompt:
      - "在当前页面下创建一个HTML文件，用户可以用鼠标画闭合曲线，画完之后计算这个曲线长度和内接圆/外接圆半径的比值，然后判断这个曲线和圆的相似度，并且打分"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-15
  - file: dalton-bead.html
    title: 拼豆图纸生成器
    prompt:
      - "测试一下，回复OK"
      - "色觉异常的人想要玩拼豆游戏，可能无法精确识别豆子的颜色，我的解决方案是使用一个HTML页面，用户上传一张照片，自动转换成网格，然后根据配色方案和拼豆的编号对照表，把在网格的颜色上标出代码。 artkal-a.json 是一个代码对照表。你现在设计一个单HTML文件，实现这个功能，自己设计合理的交互。直接开发。"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "anchored-standard"
    date: 2026-08-16
  - file: wang-tiles.html
    title: 图灵机王氏砖模拟器
    prompt:
      - "测试一下，回复ok"
      - "创建一个单文件HTML，实现一个图灵机可视化模拟，用户通过表格输入状态转移表。直接开发"
      - "基于当前文件，创建一个新文件，实现图灵机到wang瓷砖的转换功能，直接开发"
      - "之前的图灵机模拟本身的功能也保留在这个页面上，就在转换结果上面显示"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "anchored-standard"
    date: 2026-08-16
    note: "全程没有联网"
  - file: optical_simulation.html
    title: 光学模拟
    prompt:
      - "测试一下，回复ok"
      - "开发一个单文件的HTML，要求实现光学模拟仿真，包括以下内容：1. 夫琅禾费衍射；2. 双缝干涉；3. 菲涅尔衍射；4. 泊松光斑。使用3D的界面，用户可以从各个角度观察。直接开发。"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "pi"
    preset: "anchored-standard"
    date: 2026-08-17
  - file: fdtd_diffraction.html
    title: 2D FDTD光学模拟
    prompt:
      - "忽略当前目录下的文件。创建单个HTML文件，通过2D FDTD模拟夫琅禾费衍射、双缝干涉、菲涅尔衍射、泊松光斑，用户可以调节参数。直接开发。"
      - "你的光源/探测屏是垂直的线，但是看起来应该是水平的线吧，你确认下？还是说我理解有问题"
      - "如果你的屏幕是对的，那么后面的纹理就反了，现在纹理传播的方向看起来就是从上向下传播的，而不是从左向右传播的。"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-17
  - file: circuit-simulator.html
    title: 模拟电路模拟器
    prompt:
      - "忽略当前目录下的其他文件。用单个网页实现一个模拟电路模拟器，自己设计合理的交互，选择合理的技术栈，如果需要使用python，用uv运行，需要实现这些器件：\n1. 无源器件（必须实现）\n电阻（Resistor）：基础元件，支持阻值设定\n电容（Capacitor）：支持容值、初始电压，需瞬态分析\n电感（Inductor）：支持感值、初始电流\n开关（Switch）：手动开关/单刀双掷，支持交互控制\n2. 电源类（必须实现）\n直流电压源（DC Voltage Source）：电池、VCC等\n直流电流源（DC Current Source）\n交流电压源（AC Source）：正弦波，支持幅值、频率、相位\n地（Ground）：电路参考零电位，必须强制存在\n3. 半导体器件（基础版）\n二极管（Diode）：理想/实际模型，需非线性求解\nNPN/PNP 双极型晶体管（BJT）：Ebers-Moll 或 Gummel-Poon 简化模型\nN沟道/P沟道 MOSFET：Level 1（Shichman-Hodges）模型，数字/模拟混合仿真基础\n4. 信号与测量（必须实现）\n电压表/电流表（Probe）：可视化显示节点电压或支路电流\n示波器（Oscilloscope）：多通道波形显示，时域分析核心\n信号发生器（Function Generator）：方波、三角波、锯齿波"
      - "你现在的例子中，示波器并不会显示画面，是示波器实现的问题，还是这个电路本身就没有波形？如果是电路问题，你换一个例子。"
      - "连线没有删除功能，另外增加一个接线柱器件，我可以调整排版（自动排版和折线难度比较大，暂时不用开发，我用接线柱代替）"
      - "现在的示波器没有显示Y轴的数值，需要补充一下"
      - "增加一个localstorage，可以保存用户画的电路，刷新页面不会丢失。"
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-17

