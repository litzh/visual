  - file: reaction.html
    title: 反应扩散生态箱
    prompt:
      - >
        实现一个反应扩散系统，直接开发
        创建一个可直接在现代桌面浏览器中运行的单文件 HTML 应用，CSS 和 JavaScript 全部内嵌，不需要构建过程、服务器、外部资源或网络请求。优先使用 Canvas 2D；只有确有必要时使用原生 WebGL。
        应用必须是实际计算的交互式模拟器，不能用预制动画伪装模拟结果。界面使用中文，包含主模拟区域、参数控制面板、实时数据面板、预置场景、暂停/继续、单步执行、重置和随机种子控制。
        参数改变后应立即生效，危险参数必须限制范围，数值发散时不能导致页面卡死，应自动暂停并显示原因。支持 HiDPI、窗口缩放和全屏。目标是在普通笔记本上保持流畅交互。
        页面内提供简短的“原理说明”和“当前模型的局限”，明确哪些是真实物理、哪些是数值近似。关键公式使用 HTML 或 SVG 显示。不要依赖 MathJax 等外部库。
        视觉设计应适合作品展示：深色界面、清晰的色标和单位、平滑动画，但不能为了视觉效果篡改数据。
        反应扩散系统详细说明
        推荐定位
        不要只做一个 Gray–Scott 演示。做成“反应扩散生态箱”：用户像绘画一样投放物质，并观察斑点、条纹、分裂和竞争。
        模型要求
        使用二维 Gray–Scott 模型：
        \frac{\partial U}{\partial t}
        =D_U\nabla^2U-UV^2+F(1-U)
        \frac{\partial V}{\partial t}
        =D_V\nabla^2V+UV^2-(F+k)V
        需要明确要求：
        * 使用有限差分离散二维拉普拉斯算子。
        * 支持周期边界、反射边界、固定边界。
        * 支持 Euler 或半隐式积分。
        * 时间步过大时给出稳定性提示。
        * 计算网格至少支持 128²、256²、512²。
        * 模拟速度和渲染帧率分离。
        用户交互
        * 鼠标拖动投放 U 或 V。
        * 可调笔刷半径、浓度、软硬度。
        * Shift 擦除，右键放置不可反应障碍。
        * 支持画直线、圆、矩形和导入简单黑白初始图案。
        * 可局部改变 F 或 k，形成不同反应区域。
        * 鼠标悬停显示当前位置的 U、V、F、k。
        * 可暂停后逐步推进 1、10、100 个迭代步。
        可视化
        至少包含以下模式：
        * V 浓度
        * U/V 双色混合
        * U-V 差值
        * 反应速率 UV^2
        * 参数区域图
        * 等值线视图
        加入颜色映射选择和动态范围调节，但不得修改实际模拟值。
        预置场景
        至少提供：
        * 斑点分裂
        * 珊瑚生长
        * 指纹条纹
        * 蠕虫结构
        * 孤子状移动结构
        * 两种参数区域竞争
        * 中心种子向外扩散
        进阶亮点
        * 参数相图：在小网格上并行展示多个 F,k 组合。
        * 自动寻找“有趣参数”：根据空间方差、边缘密度等指标筛选。
        * 时间回溯：保存有限数量的关键帧。
        * 导出 PNG 和参数 JSON。
        验收标准
        * 相同种子和参数必须产生可复现结果。
        * 调整网格分辨率后图案性质基本一致。
        * 暂停时数值不得继续变化。
        * 512² 网格性能不足时自动降低每帧迭代次数，而不是卡死。
    model: "deepseek-v4-pro-0813"
    effort: "max"
    harness: "dsh"
    preset: "anchored-standard"
    date: 2026-08-19
  - file: soap_bubble_sim.html
    title: 肥皂泡模拟器
    prompt: 
      - >
        肥皂泡模拟
        忽略其他文件，创建一个可直接在现代桌面浏览器中运行的单文件 HTML 应用，CSS 和 JavaScript 全部内嵌，不需要构建过程、服务器、外部资源或网络请求。优先使用 Canvas 2D；只有确有必要时使用原生 WebGL。
        应用必须是实际计算的交互式模拟器，不能用预制动画伪装模拟结果。界面使用中文，包含主模拟区域、参数控制面板、实时数据面板、预置场景、暂停/继续、单步执行、重置和随机种子控制。
        参数改变后应立即生效，危险参数必须限制范围，数值发散时不能导致页面卡死，应自动暂停并显示原因。支持 HiDPI、窗口缩放和全屏。目标是在普通笔记本上保持流畅交互。
        页面内提供简短的“原理说明”和“当前模型的局限”，明确哪些是真实物理、哪些是数值近似。关键公式使用 HTML 或 SVG 显示。不要依赖 MathJax 等外部库。
        视觉设计应适合作品展示：深色界面、清晰的色标和单位、平滑动画，但不能为了视觉效果篡改数据。
        几何模型
        基础版：
        * 使用三角网格表示闭合泡膜。
        * 每个顶点受到表面张力、内部压强、阻尼和重力影响。
        * 表面张力使面积趋于最小。
        * 内外压差满足简化 Laplace–Young 关系：
        \Delta P\approx 2\gamma/R
        * 使用体积约束防止泡泡无故塌缩。
        * 用户可以拖拽表面顶点使其变形，释放后观察振荡和恢复。
        为了稳定，可用质量—弹簧网格近似，但必须注明它不是严格的连续薄膜求解器。
        薄膜厚度
        * 在泡膜表面定义随时间变化的厚度场。
        * 重力使液体向下排液。
        * 表面扩散让厚度逐渐平滑。
        * 可加入低幅随机扰动模拟流动纹理。
        * 顶部逐渐变薄，达到阈值时显示接近破裂。
        * 可选择关闭破裂机制。
        光学渲染
        对每个表面点，根据以下因素计算颜色：
        * 薄膜厚度
        * 入射角
        * 折射率
        * 可见光波长
        * 光程差
        * 一次相位反转
        不要直接使用彩虹纹理贴图。至少对多个离散波长计算干涉强度，再近似转换到 RGB。
        控制项包括：
        * 白光／单色光
        * 薄膜折射率
        * 平均厚度
        * 光源方向
        * 环境亮度
        * 观察角度
        交互
        * 拖动泡泡。
        * 戳动表面产生振荡。
        * 吹气改变内部体积。
        * 改变表面张力。
        * 开关重力。
        * 调节排液速度。
        * 切换几何、厚度、光学三种诊断视图。
        * 显示局部膜厚和预测反射光谱。
        预置场景
        * 静止球形泡
        * 重力排液
        * 快速吹大
        * 低表面张力大变形
        * 单色光下的干涉条纹
        * 白光彩色干涉
        * 即将破裂的黑膜区域
        多泡模式
        如果加入多个泡泡，应明确是近似模型：
        * 圆或球之间碰撞后形成共享边界。
